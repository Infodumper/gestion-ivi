<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — Costa Atlántica</title>
  
  <!-- Tipografías Oficiales del Sistema CliP27 / Costa Atlántica -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Supabase Cloud SDK y Conector Ivi -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/supabase-config.js"></script>
  <script src="./js/supabase-client.js"></script>
  
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(180deg, #f0f7ff 0%, #e0f2fe 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: #1e293b;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Cabecera con Logo y Título */
    .brand-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .brand-logo {
      height: 96px;
      width: auto;
      margin: 0 auto 0.75rem auto;
      display: block;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.05));
    }

    .brand-title {
      font-family: 'Libre Baskerville', serif;
      font-size: 2rem;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }

    .brand-subtitle {
      font-size: 0.95rem;
      color: #64748b;
      margin-top: 0.25rem;
      font-weight: 400;
    }

    /* Tarjeta Principal */
    .login-card {
      width: 100%;
      background-color: #ffffff;
      border-radius: 1.75rem; /* rounded-3xl */
      padding: 2.5rem 2.25rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.06), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      border: 1px solid #eff6ff;
    }

    .card-title {
      font-size: 1.625rem;
      font-weight: 700;
      color: #0f172a;
      text-align: center;
      margin-bottom: 1.75rem;
      letter-spacing: -0.01em;
    }

    /* Formulario */
    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: #2563eb; /* Azul label */
      margin-bottom: 0.45rem;
      margin-left: 0.25rem;
    }

    .form-input {
      width: 100%;
      padding: 0.875rem 1.125rem;
      font-size: 0.95rem;
      font-family: 'Poppins', sans-serif;
      border: 1px solid #e2e8f0;
      border-radius: 1rem; /* rounded-2xl */
      background-color: #ffffff;
      color: #0f172a;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input::placeholder {
      color: #94a3b8;
    }

    .form-input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    /* Botón Entrar al Sistema */
    .btn-submit {
      width: 100%;
      background-color: #1d4ed8;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      font-family: 'Poppins', sans-serif;
      padding: 0.95rem;
      border-radius: 1rem;
      border: none;
      cursor: pointer;
      box-shadow: 0 8px 20px -4px rgba(37, 99, 235, 0.35);
      transition: all 0.2s ease;
      margin-top: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
      transform: translateY(-1px);
      box-shadow: 0 12px 24px -4px rgba(37, 99, 235, 0.45);
    }

    .btn-submit:active {
      transform: scale(0.98);
    }


    /* Modal / Alert de Opción B: Solicitud Pendiente */
    .status-alert {
      display: none;
      padding: 1rem 1.25rem;
      border-radius: 1rem;
      margin-bottom: 1.25rem;
      font-size: 0.875rem;
      line-height: 1.5;
      animation: fadeIn 0.3s ease;
    }

    .status-alert.warning {
      background-color: #fffbeb;
      border: 1px solid #fde68a;
      color: #92400e;
    }

    .status-alert.danger {
      background-color: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
    }

    .status-alert.success {
      background-color: #ecfdf5;
      border: 1px solid #a7f3d0;
      color: #065f46;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Footer */
    .brand-footer {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.75rem;
      font-weight: 600;
      color: #94a3b8;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

  </style>
</head>
<body>

  <div class="login-container">
    <!-- Header -->
    <header class="brand-header">
      <img src="./styles/images/logo.png" alt="Logo Costa Atlántica" class="brand-logo" onerror="this.style.display='none'">
      <h1 class="brand-title">Costa Atlántica</h1>
      <p class="brand-subtitle">Gestión de Clientes</p>
    </header>

    <!-- Card -->
    <div class="login-card">
      <h2 class="card-title">Bienvenida</h2>

      <!-- Notificación Dinámica Opción B (Aprobación) -->
      <div id="statusAlert" class="status-alert"></div>

      <!-- Formulario Clásico -->
      <form id="loginForm" onsubmit="handleEmailLogin(event)">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="form-input" 
            placeholder="usuario@ejemplo.com" 
            required
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="form-input" 
            placeholder="••••••••" 
            required
            autocomplete="current-password"
          >
        </div>

        <button type="submit" class="btn-submit" id="btnSubmit">
          Entrar al Sistema
        </button>
      </form>

      </form>
    </div>

    <!-- Footer -->
    <footer class="brand-footer">
      &copy; 2026 EQUIPO COSTA ATLÁNTICA
    </footer>
  </div>

  <script>
    // Motor de usuarios locales de respaldo
    const UsuariosDB = JSON.parse(localStorage.getItem('ivi_usuarios_autorizados') || 'null') || [
      { email: 'infodumper.au@gmail.com', nombre: 'Ignacio Vizoso', rol: 'admin', estado: 'aprobado' },
      { email: 'ignacio.vizoso@gmail.com', nombre: 'Nacho', rol: 'vendedor', estado: 'aprobado' },
      { email: 'perlanegracostaatlantica@gmail.com', nombre: 'Paola Estévez', rol: 'admin', estado: 'aprobado' },
      { email: 'paco@policia.es', nombre: 'Paquito', rol: 'vendedor', estado: 'aprobado' }
    ];

    function guardarUsuarios() {
      localStorage.setItem('ivi_usuarios_autorizados', JSON.stringify(UsuariosDB));
    }

    function mostrarAlerta(tipo, mensaje) {
      const alertEl = document.getElementById('statusAlert');
      alertEl.className = `status-alert ${tipo}`;
      alertEl.innerHTML = mensaje;
      alertEl.style.display = 'block';
    }

    function ocultarAlerta() {
      const alertEl = document.getElementById('statusAlert');
      alertEl.style.display = 'none';
    }

    // Procesar Inicio de Sesión Solo con Email
    async function procesarAcceso(email) {
      ocultarAlerta();
      const correoNormalizado = email.trim().toLowerCase();
      const submitBtn = document.getElementById('btnSubmit');

      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerText = 'Verificando...';
      }

      try {
        let usuario = null;

        // 1. Consultar en Supabase Cloud si está conectado
        if (window.IviSupabase && window.IviSupabase.isConfigured()) {
          const client = window.IviSupabase.client;
          const { data, error } = await client
            .from('usuarios_autorizados')
            .select('*')
            .ilike('email', correoNormalizado)
            .maybeSingle();

          if (error) {
            console.warn('[Supabase Auth] Error consultando usuario:', error);
          } else if (data) {
            usuario = data;
          } else {
            // Usuario no encontrado: registrarlo como PENDIENTE en Supabase
            const nombreAuto = correoNormalizado.split('@')[0];
            const { data: nuevoUser, error: errInsert } = await client
              .from('usuarios_autorizados')
              .insert([{
                email: correoNormalizado,
                nombre: nombreAuto,
                rol: 'vendedor',
                estado: 'pendiente'
              }])
              .select()
              .single();

            if (!errInsert && nuevoUser) {
              usuario = nuevoUser;
            }
          }
        }

        // 2. Fallback a LocalStorage si Supabase no está configurado
        if (!usuario) {
          usuario = UsuariosDB.find(u => u.email.toLowerCase() === correoNormalizado);
          if (!usuario) {
            usuario = {
              email: correoNormalizado,
              nombre: correoNormalizado.split('@')[0],
              rol: 'vendedor',
              estado: 'pendiente',
              fecha_solicitud: new Date().toISOString()
            };
            UsuariosDB.push(usuario);
            guardarUsuarios();
          }
        }

        // 3. Evaluar permisos y estados
        if (usuario.estado === 'pendiente') {
          mostrarAlerta('warning', `
            <strong>⏳ Solicitud enviada</strong><br>
            Hola <strong>${usuario.nombre || 'Asesor'}</strong>. Tu cuenta está registrada pero <strong>pendiente de aprobación</strong> por el Administrador.<br>
            <small style="opacity:0.85">Una vez que seas aprobado, podrás acceder al sistema.</small>
          `);
          return;
        }

        if (usuario.estado === 'rechazado') {
          mostrarAlerta('danger', `
            <strong>⛔ Acceso Denegado</strong><br>
            Tu solicitud fue desestimada por el Administrador. Contacta a soporte.
          `);
          return;
        }

        if (usuario.estado === 'aprobado') {
          mostrarAlerta('success', `<strong>¡Bienvenido, ${usuario.nombre || 'Usuario'}!</strong> Redirigiendo al panel...`);
          localStorage.setItem('ivi_session_user', JSON.stringify(usuario));
          setTimeout(() => {
            window.location.href = './index.html';
          }, 600);
          return;
        }

      } catch (err) {
        console.error('[Login] Error:', err);
        mostrarAlerta('danger', 'Error al procesar el inicio de sesión. Intente nuevamente.');
      } finally {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerText = 'Entrar al Sistema';
        }
      }
    }

    function handleEmailLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      procesarAcceso(email);
    }

  </script>
</body>
</html>
