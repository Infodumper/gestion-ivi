<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al Sistema — Costa Atlántica</title>
  
  <!-- Tipografías Oficiales del Sistema CliP27 / Costa Atlántica -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Supabase Cloud SDK y Conector Ivi -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/supabase-config.js"></script>
  <script src="./js/supabase-client.js"></script>
  
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(180deg, #f0f7ff 0%, #e0f2fe 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: #1e293b;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Cabecera con Logo y Título */
    .brand-header {
      text-align: center;
      margin-bottom: 1.75rem;
    }

    .brand-logo {
      height: 90px;
      width: auto;
      margin: 0 auto 0.75rem auto;
      display: block;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.05));
    }

    .brand-title {
      font-family: 'Libre Baskerville', serif;
      font-size: 2rem;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }

    .brand-subtitle {
      font-size: 0.95rem;
      color: #64748b;
      margin-top: 0.25rem;
      font-weight: 400;
    }

    /* Tarjeta Principal */
    .login-card {
      width: 100%;
      background-color: #ffffff;
      border-radius: 1.75rem;
      padding: 2.25rem 2rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.06), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      border: 1px solid #eff6ff;
    }

    /* Pestañas de Modo (Login / Registro) */
    .auth-tabs {
      display: flex;
      background-color: #f1f5f9;
      padding: 0.35rem;
      border-radius: 1rem;
      margin-bottom: 1.5rem;
      gap: 0.25rem;
    }

    .auth-tab-btn {
      flex: 1;
      padding: 0.65rem;
      font-family: 'Poppins', sans-serif;
      font-size: 0.875rem;
      font-weight: 600;
      color: #64748b;
      background: transparent;
      border: none;
      border-radius: 0.75rem;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .auth-tab-btn.active {
      background: #ffffff;
      color: #2563eb;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
    }

    /* Formulario */
    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: #2563eb;
      margin-bottom: 0.45rem;
      margin-left: 0.25rem;
    }

    .form-input {
      width: 100%;
      padding: 0.85rem 1.1rem;
      font-size: 0.95rem;
      font-family: 'Poppins', sans-serif;
      border: 1px solid #e2e8f0;
      border-radius: 1rem;
      background-color: #ffffff;
      color: #0f172a;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input::placeholder {
      color: #94a3b8;
    }

    .form-input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    /* Links de ayuda */
    .form-help-row {
      display: flex;
      justify-content: flex-end;
      margin-top: -0.5rem;
      margin-bottom: 1.25rem;
    }

    .help-link {
      font-size: 0.8rem;
      color: #64748b;
      text-decoration: none;
      cursor: pointer;
      transition: color 0.15s ease;
    }

    .help-link:hover {
      color: #2563eb;
      text-decoration: underline;
    }

    /* Botón Submit */
    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      font-family: 'Poppins', sans-serif;
      padding: 0.95rem;
      border-radius: 1rem;
      border: none;
      cursor: pointer;
      box-shadow: 0 8px 20px -4px rgba(37, 99, 235, 0.35);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
      transform: translateY(-1px);
      box-shadow: 0 12px 24px -4px rgba(37, 99, 235, 0.45);
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    .btn-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    /* Avisos y Alertas */
    .status-alert {
      display: none;
      padding: 0.95rem 1.15rem;
      border-radius: 1rem;
      margin-bottom: 1.25rem;
      font-size: 0.85rem;
      line-height: 1.5;
      animation: fadeIn 0.3s ease;
    }

    .status-alert.warning {
      background-color: #fffbeb;
      border: 1px solid #fde68a;
      color: #92400e;
    }

    .status-alert.danger {
      background-color: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
    }

    .status-alert.success {
      background-color: #ecfdf5;
      border: 1px solid #a7f3d0;
      color: #065f46;
    }

    .info-badge {
      font-size: 0.775rem;
      color: #64748b;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 0.65rem 0.85rem;
      border-radius: 0.75rem;
      margin-bottom: 1.25rem;
      line-height: 1.4;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Footer */
    .brand-footer {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.75rem;
      font-weight: 600;
      color: #94a3b8;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <!-- Header -->
    <header class="brand-header">
      <img src="./styles/images/logo.png" alt="Logo Costa Atlántica" class="brand-logo" onerror="this.style.display='none'">
      <h1 class="brand-title">Costa Atlántica</h1>
      <p class="brand-subtitle">Gestión Comercial y Operativa</p>
    </header>

    <!-- Card Principal -->
    <div class="login-card">
      
      <!-- Pestañas de Selección -->
      <div class="auth-tabs">
        <button type="button" class="auth-tab-btn active" id="tabBtnLogin" onclick="switchMode('login')">
          Iniciar Sesión
        </button>
        <button type="button" class="auth-tab-btn" id="tabBtnRegister" onclick="switchMode('register')">
          Solicitar Acceso
        </button>
      </div>

      <!-- Alerta Dinámica -->
      <div id="statusAlert" class="status-alert"></div>

      <!-- FORMULARIO 1: INICIAR SESIÓN -->
      <form id="formLogin" onsubmit="handleLoginSubmit(event)">
        <div class="form-group">
          <label class="form-label" for="loginEmail">Correo Electrónico</label>
          <input 
            type="email" 
            id="loginEmail" 
            name="email" 
            class="form-input" 
            placeholder="usuario@ejemplo.com" 
            required
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="loginPassword">Contraseña</label>
          <input 
            type="password" 
            id="loginPassword" 
            name="password" 
            class="form-input" 
            placeholder="••••••••" 
            required
            autocomplete="current-password"
          >
        </div>

        <div class="form-help-row">
          <a class="help-link" onclick="handleForgotPassword()">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="btn-submit" id="btnLoginSubmit">
          <span>Entrar al Sistema</span>
        </button>
      </form>

      <!-- FORMULARIO 2: SOLICITAR ACCESO / REGISTRO -->
      <form id="formRegister" onsubmit="handleRegisterSubmit(event)" style="display: none;">
        <div class="info-badge">
          🛡️ Al registrarte, tu cuenta quedará vinculada y se enviará en estado <strong>pendiente</strong> al Administrador para su aprobación.
        </div>

        <div class="form-group">
          <label class="form-label" for="regNombre">Nombre y Apellido</label>
          <input 
            type="text" 
            id="regNombre" 
            name="nombre" 
            class="form-input" 
            placeholder="Ej: Paola Estévez" 
            required
            autocomplete="name"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="regEmail">Correo Electrónico</label>
          <input 
            type="email" 
            id="regEmail" 
            name="email" 
            class="form-input" 
            placeholder="usuario@ejemplo.com" 
            required
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="regPassword">Crear Contraseña</label>
          <input 
            type="password" 
            id="regPassword" 
            name="password" 
            class="form-input" 
            placeholder="Mínimo 6 caracteres" 
            required
            minlength="6"
            autocomplete="new-password"
          >
        </div>

        <button type="submit" class="btn-submit" id="btnRegisterSubmit">
          <span>Solicitar Acceso</span>
        </button>
      </form>

    </div>

    <!-- Footer -->
    <footer class="brand-footer">
      &copy; 2026 EQUIPO COSTA ATLÁNTICA
    </footer>
  </div>

  <script>
    let currentMode = 'login';

    function switchMode(mode) {
      currentMode = mode;
      ocultarAlerta();

      const tabLogin = document.getElementById('tabBtnLogin');
      const tabReg = document.getElementById('tabBtnRegister');
      const formLogin = document.getElementById('formLogin');
      const formRegister = document.getElementById('formRegister');

      if (mode === 'login') {
        tabLogin.classList.add('active');
        tabReg.classList.remove('active');
        formLogin.style.display = 'block';
        formRegister.style.display = 'none';
      } else {
        tabReg.classList.add('active');
        tabLogin.classList.remove('active');
        formLogin.style.display = 'none';
        formRegister.style.display = 'block';
      }
    }

    function mostrarAlerta(tipo, mensaje) {
      const alertEl = document.getElementById('statusAlert');
      alertEl.className = `status-alert ${tipo}`;
      alertEl.innerHTML = mensaje;
      alertEl.style.display = 'block';
    }

    function ocultarAlerta() {
      const alertEl = document.getElementById('statusAlert');
      alertEl.style.display = 'none';
    }

    function setLoading(btnId, isLoading, defaultText) {
      const btn = document.getElementById(btnId);
      if (!btn) return;
      btn.disabled = isLoading;
      btn.innerHTML = isLoading ? '<span>Verificando...</span>' : `<span>${defaultText}</span>`;
    }

    // 1. INICIAR SESIÓN CON SUPABASE AUTH REAL
    async function handleLoginSubmit(e) {
      e.preventDefault();
      ocultarAlerta();

      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      setLoading('btnLoginSubmit', true, 'Entrar al Sistema');

      try {
        if (!window.IviSupabase || !window.IviSupabase.isConfigured()) {
          mostrarAlerta('danger', 'Error de conexión: Supabase Cloud no está inicializado.');
          setLoading('btnLoginSubmit', false, 'Entrar al Sistema');
          return;
        }

        const authResult = await window.IviSupabase.signIn(email, password);

        mostrarAlerta('success', `
          <strong>¡Bienvenido, ${authResult.profile.nombre || 'Usuario'}!</strong><br>
          Acceso concedido. Redirigiendo al sistema...
        `);

        setTimeout(() => {
          window.location.href = './index.html';
        }, 650);

      } catch (err) {
        console.error('[Login] Error:', err);

        if (err.code === 'PENDING_APPROVAL' || err.message?.includes('PENDING_APPROVAL') || err.message?.includes('pendiente')) {
          mostrarAlerta('warning', `
            <strong>⏳ Solicitud Pendiente</strong><br>
            Tu contraseña es correcta, pero tu cuenta aún está <strong>pendiente de aprobación</strong> por un Administrador.<br>
            <small style="opacity:0.85">Comunícate con el administrador para que active tu usuario.</small>
          `);
        } else if (err.code === 'ACCESS_DENIED' || err.message?.includes('denegada')) {
          mostrarAlerta('danger', `
            <strong>⛔ Acceso Denegado</strong><br>
            Tu solicitud de acceso fue rechazada por el Administrador.
          `);
        } else if (err.message?.includes('Invalid login credentials')) {
          mostrarAlerta('danger', `
            <strong>Credenciales incorrectas</strong><br>
            El correo o la contraseña ingresados no coinciden con ninguna cuenta registrada.
          `);
        } else if (err.message?.includes('Email not confirmed')) {
          mostrarAlerta('warning', `
            <strong>✉️ Correo no confirmado</strong><br>
            Debes confirmar tu correo electrónico antes de ingresar (revisa tu bandeja de entrada o spam).
          `);
        } else {
          mostrarAlerta('danger', `Error al iniciar sesión: ${err.message || 'Intente nuevamente.'}`);
        }
      } finally {
        setLoading('btnLoginSubmit', false, 'Entrar al Sistema');
      }
    }

    // 2. REGISTRARSE Y SOLICITAR ACCESO
    async function handleRegisterSubmit(e) {
      e.preventDefault();
      ocultarAlerta();

      const nombre = document.getElementById('regNombre').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;

      if (password.length < 6) {
        mostrarAlerta('warning', 'La contraseña debe contener al menos 6 caracteres.');
        return;
      }

      setLoading('btnRegisterSubmit', true, 'Solicitar Acceso');

      try {
        if (!window.IviSupabase || !window.IviSupabase.isConfigured()) {
          mostrarAlerta('danger', 'Error de conexión con Supabase Cloud.');
          setLoading('btnRegisterSubmit', false, 'Solicitar Acceso');
          return;
        }

        await window.IviSupabase.signUp(email, password, nombre);

        mostrarAlerta('success', `
          <strong>✅ Solicitud de acceso enviada</strong><br>
          Hola <strong>${nombre}</strong>. Tu cuenta ha sido creada y enviada al Administrador en estado <strong>pendiente</strong>.<br>
          <small style="opacity:0.85">Una vez que el Administrador apruebe tu usuario, podrás iniciar sesión normalmente.</small>
        `);

        // Limpiar campos y cambiar de pestaña
        document.getElementById('formRegister').reset();
        setTimeout(() => {
          switchMode('login');
          document.getElementById('loginEmail').value = email;
        }, 3500);

      } catch (err) {
        console.error('[Register] Error:', err);
        if (err.message?.includes('User already registered')) {
          mostrarAlerta('warning', 'Este correo ya tiene una cuenta creada. Puedes iniciar sesión o solicitar recuperación de contraseña.');
        } else {
          mostrarAlerta('danger', `Error al registrar la cuenta: ${err.message || 'Intente nuevamente.'}`);
        }
      } finally {
        setLoading('btnRegisterSubmit', false, 'Solicitar Acceso');
      }
    }

    // 3. RECUPERAR CONTRASEÑA
    async function handleForgotPassword() {
      const email = prompt('Ingresa tu correo electrónico registrado para enviarte el enlace de restablecimiento de contraseña:');
      if (!email || !email.trim()) return;

      try {
        await window.IviSupabase.resetPassword(email);
        mostrarAlerta('success', `Te hemos enviado un correo a <strong>${email.trim()}</strong> con las instrucciones para restablecer tu contraseña.`);
      } catch (err) {
        mostrarAlerta('danger', `No se pudo enviar el correo de recuperación: ${err.message}`);
      }
    }
  </script>
</body>
</html>
